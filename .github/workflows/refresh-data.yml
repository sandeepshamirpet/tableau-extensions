name: Refresh Tableau Data

on:
  schedule:
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TABLEAU_PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
      TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Tableau and build JSON
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, csv, io, datetime, os

          pat_name = os.environ["TABLEAU_PAT_NAME"]
          pat_secret = os.environ["TABLEAU_PAT_SECRET"]

          # Authenticate
          auth_payload = json.dumps({
              "credentials": {
                  "personalAccessTokenName": pat_name,
                  "personalAccessTokenSecret": pat_secret,
                  "site": {"contentUrl": "camdenhomes"}
              }
          }).encode()

          req = urllib.request.Request(
              "https://us-east-1.online.tableau.com/api/3.22/auth/signin",
              data=auth_payload,
              headers={"Content-Type": "application/json", "Accept": "application/json"}
          )

          try:
              resp = urllib.request.urlopen(req)
              creds = json.loads(resp.read())["credentials"]
              token = creds["token"]
              site_id = creds["site"]["id"]
              print(f"Authenticated successfully. Site ID: {site_id}")
          except Exception as e:
              print(f"Auth failed: {e}")
              # Write empty but valid JSON so the page doesn't break
              with open("data.json", "w") as f:
                  json.dump({"updated": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"), "rows": [], "error": str(e)}, f)
              exit(1)

          # Fetch view data
          view_id = "96ea8597-9636-4176-bf36-b31c24613328"
          data_req = urllib.request.Request(
              f"https://us-east-1.online.tableau.com/api/3.22/sites/{site_id}/views/{view_id}/data",
              headers={"X-Tableau-Auth": token}
          )
          resp = urllib.request.urlopen(data_req)
          csv_text = resp.read().decode("utf-8")

          # Parse CSV
          reader = csv.DictReader(io.StringIO(csv_text))
          rows = []
          for r in reader:
              bal = r.get("balance", "0").replace(",", "")
              rent = r.get("Rent", "0").replace(",", "")
              try:
                  bal = float(bal) if bal else 0
              except:
                  bal = 0
              try:
                  rent = float(rent) if rent else 0
              except:
                  rent = 0
              rows.append({
                  "firstname": r.get("firstname", ""),
                  "lastname": r.get("lastname", ""),
                  "address": r.get("Property_street__C", ""),
                  "status": r.get("status", ""),
                  "balance": bal,
                  "rent": rent
              })

          with open("data.json", "w") as f:
              json.dump({"updated": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"), "rows": rows}, f)

          print(f"Wrote {len(rows)} rows to data.json")
          PYEOF

      - name: Commit and push updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-refresh tenant data $(date -u +%Y-%m-%d)" && git push)
